<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кирилл против Бомжей</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0d0f18;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #ffcc00;
            text-shadow: 2px 2px #ff0055;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background: #161b22;
            border: 4px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #21262d 0%, #0d1117 100%);
        }
        .ui-panel {
            margin-top: 12px;
            display: flex;
            gap: 15px;
            font-size: 13px;
        }
        .score-box, .time-box {
            background: #21262d;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #30363d;
        }
        
        /* Мобильный джойстик */
        .joystick-container {
            margin-top: 12px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .joystick-thumb {
            width: 60px;
            height: 60px;
            background: #1f6feb;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.05s linear;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #overlay h2 {
            font-size: 18px;
            color: #ff7b72;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .start-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 15px 25px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #196127;
        }
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #196127;
        }
    </style>
</head>
<body>

    <h1>КИРИЛЛ УБЕГАЕТ ОТ БОМЖЕЙ</h1>

    <div id="game-container">
        <div id="overlay">
            <h2 id="overlay-title">УВЕРНИСЬ ОТ БОМЖЕЙ!<br><span style="font-size:10px; color:#8b949e;">Используй WASD / Стрелки или джойстик</span></h2>
            <button class="start-btn" onclick="startGame()">ИГРАТЬ</button>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="ui-panel">
        <div class="score-box">МОНЕТЫ: <span id="score">0</span></div>
        <div class="time-box">ВРЕМЯ: <span id="time">0</span>с</div>
    </div>

    <!-- Джойстик для мобилок и мышки -->
    <div class="joystick-container" id="joystick">
        <div class="joystick-thumb" id="joystickThumb"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameRunning = false;
        let score = 0;
        let survivalTime = 0;
        let timerInterval = null;

        // Игрок (Кирилл)
        let kirill = {
            x: 200,
            y: 200,
            size: 32,
            speed: 3.5,
            dx: 0,
            dy: 0
        };

        let bums = [];
        let coins = [];

        // Загрузка фото Кирилла
        const kirillImg = new Image();
        kirillImg.src = 'https://lh3.googleusercontent.com/d/1Gw7W0toNqL4yghHQRHqzCCtmfm0y9cKu';

        // Клавиши управления
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Джойстик логика
        const joystick = document.getElementById('joystick');
        const thumb = document.getElementById('joystickThumb');
        let joystickActive = false;
        let joyCenter = { x: 0, y: 0 };

        joystick.addEventListener('pointerdown', (e) => {
            joystickActive = true;
            const rect = joystick.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (!joystickActive) return;
            updateJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            if (!joystickActive) return;
            joystickActive = false;
            thumb.style.transform = `translate(0px, 0px)`;
            kirill.dx = 0;
            kirill.dy = 0;
        });

        function updateJoystick(clientX, clientY) {
            const maxDist = 40;
            let dx = clientX - joyCenter.x;
            let dy = clientY - joyCenter.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            thumb.style.transform = `translate(${dx}px, ${dy}px)`;

            kirill.dx = (dx / maxDist) * kirill.speed;
            kirill.dy = (dy / maxDist) * kirill.speed;
        }

        function spawnCoin() {
            coins.push({
                x: Math.random() * 340 + 30,
                y: Math.random() * 340 + 30,
                size: 12
            });
        }

        function spawnBum() {
            // Спавним бомжа у краев экрана
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -20 : 420;
                y = Math.random() * 400;
            } else {
                x = Math.random() * 400;
                y = Math.random() < 0.5 ? -20 : 420;
            }
            bums.push({
                x: x,
                y: y,
                size: 26,
                speed: 1.8 + Math.random() * 0.8
            });
        }

        function startGame() {
            score = 0;
            survivalTime = 0;
            kirill.x = 200;
            kirill.y = 200;
            bums = [];
            coins = [];
            
            // Начальные бомжи и монетки
            spawnBum();
            spawnBum();
            spawnCoin();
            spawnCoin();

            gameRunning = true;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('score').innerText = score;
            document.getElementById('time').innerText = survivalTime;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameRunning) {
                    survivalTime++;
                    document.getElementById('time').innerText = survivalTime;
                    // Каждые 10 секунд добавляем нового бомжа
                    if (survivalTime % 8 === 0) {
                        spawnBum();
                    }
                }
            }, 1000);

            loop();
        }

        function update() {
            // Клавиатурное управление (если джойстик неактивен)
            if (!joystickActive) {
                let moveX = 0;
                let moveY = 0;
                if (keys.w || keys.ArrowUp) moveY -= 1;
                if (keys.s || keys.ArrowDown) moveY += 1;
                if (keys.a || keys.ArrowLeft) moveX -= 1;
                if (keys.d || keys.ArrowRight) moveX += 1;

                if (moveX !== 0 && moveY !== 0) {
                    moveX *= 0.7071;
                    moveY *= 0.7071;
                }
                kirill.dx = moveX * kirill.speed;
                kirill.dy = moveY * kirill.speed;
            }

            // Движение Кирилла в пределах поля
            kirill.x += kirill.dx;
            kirill.y += kirill.dy;
            kirill.x = Math.max(kirill.size/2, Math.min(canvas.width - kirill.size/2, kirill.x));
            kirill.y = Math.max(kirill.size/2, Math.min(canvas.height - kirill.size/2, kirill.y));

            // Движение бомжей за Кириллом
            bums.forEach(bum => {
                let angle = Math.atan2(kirill.y - bum.y, kirill.x - bum.x);
                bum.x += Math.cos(angle) * bum.speed;
                bum.y += Math.sin(angle) * bum.speed;

                // Проверка столкновения Кирилла с бомжом
                let dist = Math.hypot(kirill.x - bum.x, kirill.y - bum.y);
                if (dist < (kirill.size/2 + bum.size/2 - 5)) {
                    gameOver();
                }
            });

            // Сбор монет
            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                let dist = Math.hypot(kirill.x - c.x, kirill.y - c.y);
                if (dist < kirill.size/2 + c.size) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    coins.splice(i, 1);
                    spawnCoin();
                    // Спавним нового бомжа за каждые 3 монеты для сложности
                    if (score % 30 === 0) {
                        spawnBum();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем монетки
            coins.forEach(c => {
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#d29922';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.font = '10px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', c.x, c.y);
            });

            // Рисуем бомжей
            bums.forEach(bum => {
                ctx.fillStyle = '#8b5cf6';
                ctx.beginPath();
                ctx.arc(bum.x, bum.y, bum.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#6d28d9';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Шапка бомжа
                ctx.fillStyle = '#374151';
                ctx.fillRect(bum.x - bum.size/2, bum.y - bum.size - 4, bum.size, 6);
            });

            // Рисуем Кирилла (большое фото)
            ctx.save();
            ctx.beginPath();
            ctx.arc(kirill.x, kirill.y, kirill.size, 0, Math.PI * 2);
            ctx.clip();
            if (kirillImg.complete) {
                ctx.drawImage(kirillImg, kirill.x - kirill.size, kirill.y - kirill.size, kirill.size * 2, kirill.size * 2);
            } else {
                ctx.fillStyle = '#58a6ff';
                ctx.fill();
            }
            ctx.restore();

            // Обводка вокруг Кирилла
            ctx.strokeStyle = '#58a6ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(kirill.x, kirill.y, kirill.size, 0, Math.PI * 2);
            ctx.stroke();
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(timerInterval);
            document.getElementById('overlay-title').innerHTML = `ПОЙМАЛИ!<br><span style="font-size:12px; color:#fff;">Счет: ${score} | Время: ${survivalTime}с</span>`;
            document.getElementById('overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
