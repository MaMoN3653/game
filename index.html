<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поймай крота!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .scoreboard {
            font-size: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .score-val, .time-val {
            font-weight: bold;
            color: #d63031;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 15px;
            background: #6c5ce7;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .hole {
            width: 100px;
            height: 100px;
            background: #2d3436;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 0 #1e272c;
            cursor: pointer;
        }

        .mole {
            width: 80px;
            height: 80px;
            background: #e17055;
            border-radius: 50%;
            position: absolute;
            bottom: -90px;
            left: 10px;
            transition: bottom 0.1s ease-in-out;
            box-shadow: inset 0 -5px 0 #d63031;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .hole.up .mole {
            bottom: 10px;
        }

        button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #00cec9;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Поймай крота!</h1>
    <div class="scoreboard">
        Счет: <span class="score-val" id="score">0</span> | 
        Время: <span class="time-val" id="time">30</span>с
    </div>

    <div class="grid">
        <div class="hole" id="hole-0"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-1"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-2"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-3"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-4"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-5"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-6"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-7"><div class="mole">🐹</div></div>
        <div class="hole" id="hole-8"><div class="mole">🐹</div></div>
    </div>

    <button id="startBtn" onclick="startGame()">Старт игры</button>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.getElementById('score');
        const timeBoard = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        
        let lastHole;
        let timeUp = false;
        let score = 0;
        let gameTimer;
        let moleTimer;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = randomTime(400, 1000); // Время, сколько крот виден
            const hole = randomHole(holes);
            hole.classList.add('up');
            
            moleTimer = setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            scoreBoard.textContent = 0;
            timeBoard.textContent = 30;
            startBtn.disabled = true;
            timeUp = false;
            score = 0;
            let timeLeft = 30;

            peep();

            gameTimer = setInterval(() => {
                timeLeft--;
                timeBoard.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    clearTimeout(moleTimer);
                    timeUp = true;
                    holes.forEach(hole => hole.classList.remove('up'));
                    startBtn.disabled = false;
                    alert(`Игра окончена! Твой счет: ${score}`);
                }
            }, 1000);
        }

        holes.forEach(hole => {
            hole.addEventListener('click', () => {
                if (!hole.classList.contains('up') || timeUp) return;
                score++;
                scoreBoard.textContent = score;
                hole.classList.remove('up'); // Спрятать крота сразу после удара
            });
        });
    </script>
</body>
</html>
