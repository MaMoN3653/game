<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>3D SPG Artillery Simulator - Meme Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Impact', 'Arial Black', sans-serif; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* UI Layer */
    .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
    .interactive { pointer-events: auto; }

    /* Panels */
    .panel { background: rgba(15, 25, 15, 0.75); backdrop-filter: blur(8px); border: 2px solid rgba(100, 255, 100, 0.5); border-radius: 12px; padding: 10px 14px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); color: #8eff8e; text-shadow: 0 0 4px #000; }

    /* Clean Crosshair Scope (No Dark Vignette Bands) */
    #scope-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: flex; justify-content: center; align-items: center; }
    .scope-center { position: relative; width: 10px; height: 10px; }
    .scope-cross-v { position: absolute; top: -40px; left: 4px; width: 2px; height: 80px; background: rgba(0, 255, 100, 0.9); box-shadow: 0 0 4px #000; }
    .scope-cross-h { position: absolute; top: 4px; left: -40px; width: 80px; height: 2px; background: rgba(0, 255, 100, 0.9); box-shadow: 0 0 4px #000; }
    .scope-ring { position: absolute; top: -30px; left: -30px; width: 70px; height: 70px; border: 2px dashed rgba(0, 255, 100, 0.6); border-radius: 50%; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; width: 100%; }
    .title-box { font-size: 1.1rem; color: #ffe600; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }

    /* Minimap */
    #minimap-card { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #55ff55; background: rgba(0, 30, 0, 0.8); position: relative; overflow: hidden; }
    #minimap-canvas { width: 100%; height: 100%; }

    /* Compact Flight Overlay (Top Right) */
    #flight-hud { position: absolute; top: 12px; right: 12px; z-index: 25; display: none; background: rgba(0, 20, 0, 0.85); backdrop-filter: blur(6px); border: 2px solid #ffe600; border-radius: 10px; padding: 8px 12px; pointer-events: none; color: #fff; font-size: 0.85rem; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    #flight-hud .flight-title { color: #ffe600; font-weight: bold; font-size: 0.95rem; text-align: center; margin-bottom: 3px; }

    /* Touch Controls */
    .controls-container { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-bottom: 4px; }
    .dpad-container { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
    .btn-dpad { background: rgba(20, 60, 20, 0.7); border: 2px solid #55ff55; color: #fff; font-size: 1.3rem; font-weight: bold; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-dpad:active { background: rgba(100, 255, 100, 0.7); transform: scale(0.95); }

    .action-panel { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .btn-action { background: linear-gradient(180deg, #ff8800, #cc3300); border: 2px solid #ffaa00; color: #fff; padding: 12px 20px; font-size: 1.1rem; border-radius: 12px; font-family: inherit; font-weight: bold; cursor: pointer; text-shadow: 0 2px 4px #000; box-shadow: 0 4px 15px rgba(255, 100, 0, 0.4); }
    .btn-action:active { transform: scale(0.95); background: #ffaa00; }
    .btn-sec { background: rgba(20, 40, 20, 0.8); border: 1.5px solid #77ff77; color: #77ff77; padding: 8px 12px; font-size: 0.85rem; border-radius: 8px; font-family: inherit; cursor: pointer; }

    /* Meme Notifications */
    #meme-banner { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%) scale(0); z-index: 30; font-size: 2.2rem; color: #ffe600; text-shadow: 3px 3px 0 #ff0055, -2px -2px 0 #000; text-align: center; pointer-events: none; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27); width: 90%; }
    #meme-banner.active { transform: translate(-50%, -50%) scale(1); }

    .selector-row { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .btn-select { background: rgba(0,0,0,0.6); border: 1px solid #8eff8e; color: #8eff8e; font-size: 0.75rem; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
    .btn-select.active { background: #ffe600; color: #000; font-weight: bold; border-color: #ffe600; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Clean Scope View -->
  <div id="scope-overlay">
    <div class="scope-center">
      <div class="scope-cross-v"></div>
      <div class="scope-cross-h"></div>
      <div class="scope-ring"></div>
    </div>
  </div>

  <!-- Compact Flight HUD -->
  <div id="flight-hud">
    <div class="flight-title" id="hud-flight-title"></div>
    <div><span id="hud-txt-alt"></span>: <span id="flight-alt" style="color:#ffe600;">0</span>m | <span id="hud-txt-dist"></span>: <span id="flight-dist" style="color:#ffe600;">0</span>m</div>
    <div style="font-size: 0.75rem; color:#aaa; margin-top: 2px;" id="hud-flight-ctrl"></div>
  </div>

  <!-- Meme Notification Banner -->
  <div id="meme-banner"></div>

  <!-- Main HUD Layer -->
  <div class="hud-layer">
    <div class="top-bar">
      <div class="panel title-box interactive">
        <span id="txt-title"></span>
        <button class="btn-sec" id="btn-bgm">🔊 BGM</button>
      </div>
      <div id="minimap-card" class="interactive">
        <canvas id="minimap-canvas"></canvas>
      </div>
    </div>

    <!-- Telemetry & Ammo Selection -->
    <div class="panel interactive" style="align-self: flex-start; max-width: 320px; font-size: 0.85rem;">
      <div><span id="txt-azimuth"></span>: <span id="tele-azimuth" style="color:#fff;">0°</span> | <span id="txt-elevation"></span>: <span id="tele-elevation" style="color:#fff;">15°</span></div>
      <div><span id="txt-target-dist"></span>: <span id="tele-dist" style="color:#ffe600;">1200м</span></div>
      <div style="margin-top: 6px; font-size:0.75rem; color:#ffe600;" id="txt-select-ammo"></div>
      <div class="selector-row">
        <button class="btn-select active" data-ammo="pike" id="btn-ammo-pike"></button>
        <button class="btn-select" data-ammo="catfish" id="btn-ammo-catfish"></button>
        <button class="btn-select" data-ammo="sardines" id="btn-ammo-sardines"></button>
        <button class="btn-select" data-ammo="bread" id="btn-ammo-bread"></button>
      </div>
    </div>

    <!-- Bottom Controls Container -->
    <div class="controls-container">
      <!-- Touch D-Pad Aiming -->
      <div class="dpad-container interactive">
        <div></div>
        <div class="btn-dpad" id="btn-up">▲</div>
        <div></div>
        <div class="btn-dpad" id="btn-left">◀</div>
        <div class="btn-dpad" id="btn-sens" style="font-size:0.65rem; color:#ffe600; text-align:center;">SENS<br>MED</div>
        <div class="btn-dpad" id="btn-right">▶</div>
        <div></div>
        <div class="btn-dpad" id="btn-down">▼</div>
        <div></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-panel interactive">
        <div style="display:flex; gap:6px;">
          <button class="btn-sec" id="btn-cam">👁️ SCOPE</button>
          <button class="btn-sec" id="btn-zoom">🔍 ZOOM: 1x</button>
        </div>
        <button class="btn-action" id="btn-fire"></button>
      </div>
    </div>
  </div>

  <script>
    // Safe Unicode Strings
    const S = {
      title: "\u0026#128031; \u0421\u0410\u0423 \"\u0429\u0423\u041a\u0410-152\"",
      flightTitle: "\u0026#128640; \u041f\u041e\u041b\u0401\u0422 \u0421\u041d\u0410\u0420\u042f\u0414\u0410",
      alt: "\u0412\u044b\u0441\u043e\u0442\u0430",
      dist: "\u0414\u0438\u0441\u0442",
      flightCtrl: "\u0423\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435: W/A/S/D \u0438\u043b\u0438 \u0421\u0442\u0440\u0435\u043b\u043a\u0438",
      azimuth: "\u0410\u0417\u0418\u041c\u0423\u0422",
      elevation: "\u0423\u0413\u041e\u041b",
      targetDist: "\u0414\u0418\u0421\u0422. \u0426\u0415\u041b\u0418",
      selectAmmo: "\u0412\u042b\u0411\u041e\u0420 \u0421\u041d\u0410\u0420\u042f\u0414\u0410:",
      pike: "\u0026#128031; \u0429\u0423\u041a\u0410",
      catfish: "\u0026#128049; \u0421\u041e\u041c-\u0422\u042f\u0416",
      sardines: "\u0026#129387; \u0428\u041f\u0420\u041e\u0422\u042b",
      bread: "\u0026#127838; \u0411\u0410\u0422\u041e\u041d",
      fire: "\u0026#128293; \u041e\u0413\u041e\u041d\u042c (\u041f\u041b\u0418!)",
      hitHedgehog: "\u0415\u0416\u0418\u041a \u0412 \u0422\u0423\u041c\u0410\u041d\u0415! \u0026#129428;",
      hitCat: "\u041a\u041e\u0422 \u0423\u041b\u0415\u0422\u0415\u041b \u0412 \u041a\u041e\u0421\u041c\u041e\u0421! \u0026#128570;",
      hitGrandma: "\u041c\u042d\u0420\u0418 \u041f\u041e\u041f\u041f\u0418\u041d\u0421! \u0026#128477;",
      hitGoose: "\u0425\u041e\u041d\u041a! \u0413\u0423\u0421\u042c \u041e\u0411\u0415\u0417\u0412\u0420\u0415\u0416\u0415\u041d! \u0026#129435;",
      hitCar: "\u0414\u0420\u0418\u0424\u0422 \u041d\u0410 \u0416\u0418\u0413\u0423\u041b\u042f\u0425! \u0026#128663;",
      splash: "\u0411\u0423\u041b\u042c\u041a! \u041f\u0420\u042f\u041c\u041e \u0412 \u0413\u0420\u042f\u0417\u042c! \u0026#128166;"
    };

    // Apply Localized Labels
    document.getElementById('txt-title').innerHTML = S.title;
    document.getElementById('hud-flight-title').innerHTML = S.flightTitle;
    document.getElementById('hud-txt-alt').innerText = S.alt;
    document.getElementById('hud-txt-dist').innerText = S.dist;
    document.getElementById('hud-flight-ctrl').innerText = S.flightCtrl;
    document.getElementById('txt-azimuth').innerText = S.azimuth;
    document.getElementById('txt-elevation').innerText = S.elevation;
    document.getElementById('txt-target-dist').innerText = S.targetDist;
    document.getElementById('txt-select-ammo').innerText = S.selectAmmo;
    document.getElementById('btn-ammo-pike').innerHTML = S.pike;
    document.getElementById('btn-ammo-catfish').innerHTML = S.catfish;
    document.getElementById('btn-ammo-sardines').innerHTML = S.sardines;
    document.getElementById('btn-ammo-bread').innerHTML = S.bread;
    document.getElementById('btn-fire').innerHTML = S.fire;

    // --- Audio Sound Synthesizer (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playLaunch() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.45);
        gain.gain.setValueAtTime(1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.45);
      }
      playImpact() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(90, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.7);
        gain.gain.setValueAtTime(1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.7);
      }
      playSplash() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
    }
    const snd = new SoundEngine();

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.00015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 12000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(2000, 4000, 2000);
    scene.add(dirLight);

    // Terrain Creation (10,000m x 10,000m)
    const mapSize = 10000;
    const terrGeo = new THREE.PlaneBufferGeometry(mapSize, mapSize, 64, 64);
    terrGeo.rotateX(-Math.PI / 2);
    const pos = terrGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      if (Math.abs(x) > 300 || Math.abs(z) > 300) {
        pos.setY(i, Math.sin(x * 0.002) * Math.cos(z * 0.002) * 120 + Math.sin(x * 0.0005) * 200);
      }
    }
    terrGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(terrGeo, new THREE.MeshLambertMaterial({ color: 0x4b7832 }));
    scene.add(terrain);

    // Player SPG Model
    const spgGroup = new THREE.Group();
    scene.add(spgGroup);
    const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(6, 2.5, 10), new THREE.MeshLambertMaterial({ color: 0x2e4a21 }));
    bodyMesh.position.y = 1.25;
    spgGroup.add(bodyMesh);

    const turretGroup = new THREE.Group();
    turretGroup.position.set(0, 2.5, -1);
    spgGroup.add(turretGroup);
    turretGroup.add(new THREE.Mesh(new THREE.BoxGeometry(5, 2, 6), new THREE.MeshLambertMaterial({ color: 0x3b5e2b })));

    const barrelPivot = new THREE.Group();
    barrelPivot.position.set(0, 0.3, 2.5);
    turretGroup.add(barrelPivot);
    const barrelMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 8, 12), new THREE.MeshLambertMaterial({ color: 0x1f3316 }));
    barrelMesh.rotateX(Math.PI / 2);
    barrelMesh.position.z = 4;
    barrelPivot.add(barrelMesh);

    // Ammo Creation Helpers
    function createAmmoMesh(type) {
      const g = new THREE.Group();
      if (type === 'pike') {
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 4, 8), new THREE.MeshStandardMaterial({ color: 0x55aa55 }));
        body.rotateX(Math.PI / 2);
        g.add(body);
      } else if (type === 'catfish') {
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.6, 5, 8), new THREE.MeshStandardMaterial({ color: 0x334433 }));
        body.rotateX(Math.PI / 2);
        g.add(body);
      } else if (type === 'sardines') {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 3), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
        g.add(box);
      } else { // Bread
        const bread = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 3), new THREE.MeshStandardMaterial({ color: 0xc88a4b }));
        g.add(bread);
      }
      return g;
    }

    // Target Setup
    const targets = [];
    const memeBanners = [S.hitHedgehog, S.hitCat, S.hitGrandma, S.hitGoose, S.hitCar];
    function spawnTargets() {
      const positions = [
        { x: 0, z: -1000 }, { x: 300, z: -1600 }, { x: -400, z: -2200 },
        { x: 800, z: -3000 }, { x: -600, z: -3800 }
      ];
      positions.forEach((p, idx) => {
        const tgt = new THREE.Mesh(new THREE.SphereGeometry(14, 16, 16), new THREE.MeshLambertMaterial({ color: 0xff3333 }));
        tgt.position.set(p.x, 14, p.z);
        scene.add(tgt);
        targets.push({ mesh: tgt, msg: memeBanners[idx % memeBanners.length], hp: 1 });
      });
    }
    spawnTargets();

    // Game Variables
    let azimuth = 0;
    let elevation = 15;
    let selectedAmmo = 'pike';
    let currentZoom = 1;
    let cameraMode = 'scope';
    let activeShell = null;
    let sensSpeed = 0.2;

    // Controls
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function setupHoldBtn(id, action) {
      const el = document.getElementById(id);
      let timer = null;
      const start = (e) => { e.preventDefault(); action(); timer = setInterval(action, 30); };
      const stop = () => clearInterval(timer);
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointerleave', stop);
    }
    setupHoldBtn('btn-up', () => elevation = Math.min(75, elevation + sensSpeed));
    setupHoldBtn('btn-down', () => elevation = Math.max(-3, elevation - sensSpeed));
    setupHoldBtn('btn-left', () => azimuth -= sensSpeed);
    setupHoldBtn('btn-right', () => azimuth += sensSpeed);

    document.getElementById('btn-sens').onclick = () => {
      if (sensSpeed === 0.2) { sensSpeed = 0.05; document.getElementById('btn-sens').innerHTML = "SENS<br>FINE"; }
      else { sensSpeed = 0.2; document.getElementById('btn-sens').innerHTML = "SENS<br>MED"; }
    };

    document.querySelectorAll('.btn-select').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.btn-select').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAmmo = btn.dataset.ammo;
      };
    });

    // Fire Mechanics
    document.getElementById('btn-fire').onclick = () => {
      if (activeShell) return;
      snd.playLaunch();

      const shell = createAmmoMesh(selectedAmmo);
      const muzzlePos = new THREE.Vector3();
      barrelPivot.getWorldPosition(muzzlePos);
      shell.position.copy(muzzlePos);
      scene.add(shell);

      const speed = selectedAmmo === 'catfish' ? 210 : 270;
      const radAz = (azimuth * Math.PI) / 180;
      const radEl = (elevation * Math.PI) / 180;
      const vel = new THREE.Vector3(
        Math.sin(radAz) * Math.cos(radEl) * speed,
        Math.sin(radEl) * speed,
        -Math.cos(radAz) * Math.cos(radEl) * speed
      );

      activeShell = { mesh: shell, vel: vel };
      cameraMode = 'fly';
      document.getElementById('flight-hud').style.display = 'block';
    };

    // Camera Switch & Zoom
    document.getElementById('btn-cam').onclick = () => {
      cameraMode = cameraMode === 'scope' ? 'free' : 'scope';
      document.getElementById('scope-overlay').style.display = cameraMode === 'scope' ? 'flex' : 'none';
    };
    document.getElementById('btn-zoom').onclick = () => {
      if (currentZoom === 1) currentZoom = 2.5;
      else if (currentZoom === 2.5) currentZoom = 5;
      else currentZoom = 1;
      camera.fov = 60 / currentZoom;
      camera.updateProjectionMatrix();
      document.getElementById('btn-zoom').innerText = `🔍 ZOOM: ${currentZoom}x`;
    };

    function showMemeBanner(text) {
      const b = document.getElementById('meme-banner');
      b.innerHTML = text;
      b.classList.add('active');
      setTimeout(() => b.classList.remove('active'), 2500);
    }

    // Main Loop
    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min((performance.now() - lastTime) / 1000, 0.1);
      lastTime = performance.now();

      // Keyboard input
      if (keys['KeyW'] || keys['ArrowUp']) elevation = Math.min(75, elevation + sensSpeed);
      if (keys['KeyS'] || keys['ArrowDown']) elevation = Math.max(-3, elevation - sensSpeed);
      if (keys['KeyA'] || keys['ArrowLeft']) azimuth -= sensSpeed;
      if (keys['KeyD'] || keys['ArrowRight']) azimuth += sensSpeed;

      turretGroup.rotation.y = (-azimuth * Math.PI) / 180;
      barrelPivot.rotation.x = (-elevation * Math.PI) / 180;

      if (activeShell) {
        // In-flight steering
        if (keys['KeyA'] || keys['ArrowLeft']) activeShell.vel.x -= 18 * dt;
        if (keys['KeyD'] || keys['ArrowRight']) activeShell.vel.x += 18 * dt;
        if (keys['KeyW'] || keys['ArrowUp']) activeShell.vel.y += 18 * dt;
        if (keys['KeyS'] || keys['ArrowDown']) activeShell.vel.y -= 18 * dt;

        activeShell.vel.y -= 9.81 * 7.5 * dt;
        activeShell.mesh.position.addScaledVector(activeShell.vel, dt);
        activeShell.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), activeShell.vel.clone().normalize());

        document.getElementById('flight-alt').innerText = Math.max(0, Math.round(activeShell.mesh.position.y));
        document.getElementById('flight-dist').innerText = Math.round(activeShell.mesh.position.distanceTo(spgGroup.position));

        if (cameraMode === 'fly') {
          const camOffset = activeShell.vel.clone().normalize().multiplyScalar(-28).add(new THREE.Vector3(0, 7, 0));
          camera.position.copy(activeShell.mesh.position).add(camOffset);
          camera.lookAt(activeShell.mesh.position);
        }

        // Hit Detection
        targets.forEach(t => {
          if (t.hp > 0 && activeShell.mesh.position.distanceTo(t.mesh.position) < 22) {
            t.hp = 0;
            scene.remove(t.mesh);
            snd.playImpact();
            showMemeBanner(t.msg);
            removeShell();
          }
        });

        if (activeShell && activeShell.mesh.position.y <= 1) {
          snd.playSplash();
          showMemeBanner(S.splash);
          removeShell();
        }
      } else {
        if (cameraMode === 'scope') {
          const scopePos = new THREE.Vector3();
          barrelPivot.getWorldPosition(scopePos);
          camera.position.copy(scopePos).add(new THREE.Vector3(0, 1.2, 0));
          const targetLook = new THREE.Vector3(0, 0, -100)
            .applyAxisAngle(new THREE.Vector3(1, 0, 0), barrelPivot.rotation.x)
            .applyAxisAngle(new THREE.Vector3(0, 1, 0), turretGroup.rotation.y)
            .add(scopePos);
          camera.lookAt(targetLook);
        }
      }

      document.getElementById('tele-azimuth').innerText = `${Math.round(azimuth)}°`;
      document.getElementById('tele-elevation').innerText = `${Math.round(elevation)}°`;

      renderer.render(scene, camera);
    }

    function removeShell() {
      if (activeShell) {
        scene.remove(activeShell.mesh);
        activeShell = null;
        document.getElementById('flight-hud').style.display = 'none';
        setTimeout(() => cameraMode = 'scope', 1200);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
