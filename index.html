<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бомж и Кирилл — Аркада</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0d0f18;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffcc00;
            text-shadow: 2px 2px #ff0055;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background: #161b22;
            border: 4px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #21262d 0%, #0d1117 100%);
        }
        .ui-panel {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            font-size: 14px;
        }
        .score-box, .lives-box {
            background: #21262d;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #30363d;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            width: 400px;
        }
        .control-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #196127;
            transition: all 0.1s ease;
        }
        .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #196127;
        }
        .control-btn.left { background: #1f6feb; box-shadow: 0 4px #1158c7; }
        .control-btn.left:active { box-shadow: 0 0 #1158c7; }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #overlay h2 {
            font-size: 20px;
            color: #ff7b72;
            margin-bottom: 20px;
        }
        .start-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 15px 25px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #196127;
        }
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #196127;
        }
    </style>
</head>
<body>

    <h1>БОМЖ И КИРИЛЛ</h1>

    <div id="game-container">
        <div id="overlay">
            <h2 id="overlay-title">НАЙДИ И ПОЙМАЙ КИРИЛЛА</h2>
            <button class="start-btn" onclick="startGame()">ИГРАТЬ</button>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="ui-panel">
        <div class="score-box">СЧЕТ: <span id="score">0</span></div>
        <div class="lives-box">ЖИЗНИ: <span id="lives">❤️❤️❤️</span></div>
    </div>

    <div class="controls-grid">
        <button class="control-btn left" ontouchstart="movePlayer(0); event.preventDefault();" onclick="movePlayer(0)">↖ ЛЕВЕРХ</button>
        <button class="control-btn" ontouchstart="movePlayer(1); event.preventDefault();" onclick="movePlayer(1)">↗ ПРАВЕРХ</button>
        <button class="control-btn left" ontouchstart="movePlayer(2); event.preventDefault();" onclick="movePlayer(2)">↙ ЛЕВНИЗ</button>
        <button class="control-btn" ontouchstart="movePlayer(3); event.preventDefault();" onclick="movePlayer(3)">↘ ПРАВНИЗ</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let playerPos = 0; // 0: верх-лево, 1: верх-право, 2: низ-лево, 3: низ-право
        let items = [];
        let spawnTimer = 0;
        let spawnInterval = 90;
        let gameSpeed = 1.5;

        // Загрузка фото Кирилла
        const kirillImg = new Image();
        kirillImg.src = 'https://lh3.googleusercontent.com/d/1Gw7W0toNqL4yghHQRHqzCCtmfm0y9cKu';

        // Аудио контекст для звуков
        let audioCtx = null;
        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'catch') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        const positions = [
            { startX: 20, startY: 100, targetX: 110, targetY: 150, lane: 0 }, // Верх-лево
            { startX: 380, startY: 100, targetX: 290, targetY: 150, lane: 1 }, // Верх-право
            { startX: 20, startY: 280, targetX: 110, targetY: 230, lane: 2 }, // Низ-лево
            { startX: 380, startY: 280, targetX: 290, targetY: 230, lane: 3 }  // Низ-право
        ];

        function startGame() {
            score = 0;
            lives = 3;
            gameSpeed = 1.5;
            spawnInterval = 90;
            items = [];
            gameRunning = true;
            document.getElementById('overlay').style.display = 'none';
            updateUI();
            loop();
        }

        function movePlayer(pos) {
            if (!gameRunning) return;
            playerPos = pos;
        }

        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                playerPos = (playerPos > 1) ? playerPos - 2 : playerPos;
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                playerPos = (playerPos < 2) ? playerPos + 2 : playerPos;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                playerPos = (playerPos % 2 === 1) ? playerPos - 1 : playerPos;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                playerPos = (playerPos % 2 === 0) ? playerPos + 1 : playerPos;
            }
        });

        function spawnItem() {
            const lane = Math.floor(Math.random() * 4);
            const data = positions[lane];
            items.push({
                lane: lane,
                x: data.startX,
                y: data.startY,
                progress: 0 // от 0 до 1
            });
        }

        function update() {
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnItem();
                spawnTimer = 0;
                if (spawnInterval > 35) spawnInterval -= 1.5;
            }

            gameSpeed += 0.0005;

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.progress += 0.008 * gameSpeed;

                const data = positions[item.lane];
                item.x = data.startX + (data.targetX - data.startX) * item.progress;
                item.y = data.startY + (data.targetY - data.startY) * item.progress;

                // Проверка падения в корзину
                if (item.progress >= 1) {
                    if (item.lane === playerPos) {
                        score += 1;
                        playSound('catch');
                    } else {
                        lives -= 1;
                        playSound('miss');
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                    items.splice(i, 1);
                    updateUI();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем линии желобов
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 3;
            positions.forEach(p => {
                ctx.beginPath();
                ctx.moveTo(p.startX, p.startY);
                ctx.lineTo(p.targetX, p.targetY);
                ctx.stroke();
            });

            // Рисуем падающие объекты (Кирилл)
            items.forEach(item => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(item.x, item.y, 18, 0, Math.PI * 2);
                ctx.clip();
                if (kirillImg.complete) {
                    ctx.drawImage(kirillImg, item.x - 18, item.y - 18, 36, 36);
                } else {
                    ctx.fillStyle = '#ff7b72';
                    ctx.fill();
                }
                ctx.restore();
            });

            // Рисуем Бомжа в центре с корзиной
            ctx.fillStyle = '#21262d';
            ctx.beginPath();
            ctx.arc(200, 190, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#58a6ff';
            ctx.stroke();

            // Лицо бомжа (упрощенно)
            ctx.fillStyle = '#f0b429';
            ctx.beginPath();
            ctx.arc(200, 190, 25, 0, Math.PI * 2);
            ctx.fill();

            // Положение корзины бомжа в зависимости от выбранного сектора
            let basketX = 200, basketY = 190;
            if (playerPos === 0) { basketX = 130; basketY = 130; }
            if (playerPos === 1) { basketX = 270; basketY = 130; }
            if (playerPos === 2) { basketX = 130; basketY = 250; }
            if (playerPos === 3) { basketX = 270; basketY = 250; }

            // Рисуем корзину
            ctx.fillStyle = '#d29922';
            ctx.beginPath();
            ctx.arc(basketX, basketY, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = '❤️'.repeat(lives);
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('overlay-title').innerText = `ИГРА ОКОНЧЕНА\nСчет: ${score}`;
            document.getElementById('overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
