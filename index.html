<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>БеЛАЗ: Смена в ТикТоке</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* Кабина БеЛАЗа */
    .cabin {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #1f2738 0%, #0d121c 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Лобовое стекло (Вид на карьер) */
    .windshield {
      position: relative;
      width: 100%;
      height: 55%;
      background: linear-gradient(180deg, #87CEEB 0%, #E0CDA9 60%, #8B5A2B 100%);
      overflow: hidden;
      border-bottom: 12px solid #222;
    }
    .quarry-bg {
      position: absolute;
      bottom: 0; width: 100%; height: 80%;
      background: repeating-linear-gradient(0deg, #7a5230, #7a5230 20px, #613e23 20px, #613e23 40px);
      clip-path: polygon(0 40%, 20% 20%, 40% 50%, 60% 10%, 80% 35%, 100% 15%, 100% 100%, 0 100%);
    }

    /* Первый отдел (Инспектор в белой каске) */
    .inspector {
      position: absolute;
      bottom: 10px;
      left: -150px;
      width: 130px;
      height: 180px;
      transition: left 0.4s ease-out;
      z-index: 5;
    }
    .inspector.active { left: 15%; }
    .inspector .head {
      position: absolute; top: 10px; left: 35px; width: 50px; height: 50px;
      background: #f1c27d; border-radius: 50%;
    }
    .inspector .helmet {
      position: absolute; top: -5px; left: 25px; width: 70px; height: 30px;
      background: #ffffff; border-radius: 35px 35px 5px 5px;
      border: 2px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .inspector .helmet-visor {
      position: absolute; top: 18px; left: 20px; width: 80px; height: 8px;
      background: #e0e0e0; border-radius: 3px;
    }
    .inspector .body-suit {
      position: absolute; top: 60px; left: 25px; width: 70px; height: 100px;
      background: #1e3d59; border-radius: 10px 10px 0 0;
    }
    .inspector .vest {
      position: absolute; top: 60px; left: 25px; width: 70px; height: 60px;
      background: #ff6e40;
    }

    /* Панель приборов БеЛАЗа */
    .dashboard {
      position: relative;
      height: 45%;
      background: #2a2d32;
      border-top: 6px solid #111;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px;
    }
    .wheel {
      width: 140px; height: 140px;
      border: 20px solid #111;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, #333 40%, transparent 41%);
      box-shadow: inset 0 0 10px #000;
    }
    .wheel-hands {
      position: absolute; width: 100%; height: 100%;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 5px; opacity: 0; transition: opacity 0.2s;
    }
    .wheel-hands.visible { opacity: 1; }
    .hand { width: 30px; height: 40px; background: #f1c27d; border-radius: 8px; }

    /* Михалыч */
    .partner {
      position: absolute; right: 20px; bottom: 40px;
      width: 120px; height: 160px; background: #3d405b;
      border-radius: 20px 20px 0 0;
    }
    .partner-head {
      position: absolute; top: -40px; left: 30px; width: 60px; height: 60px;
      background: #dda15e; border-radius: 50%;
    }
    .partner-cap {
      position: absolute; top: -50px; left: 25px; width: 70px; height: 25px;
      background: #bc4749; border-radius: 15px 15px 0 0;
    }
    .speech-bubble {
      position: absolute; top: -110px; right: 10px;
      background: #fff; color: #000; padding: 10px 14px;
      border-radius: 12px; font-size: 13px; font-weight: bold;
      max-width: 180px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10; display: none;
    }
    .speech-bubble:after {
      content: ''; position: absolute; bottom: -10px; right: 30px;
      border-width: 10px 10px 0; border-style: solid;
      border-color: #fff transparent; display: block; width: 0;
    }

    /* Телефон */
    .phone-container {
      position: absolute;
      bottom: -450px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 440px;
      background: #000;
      border: 8px solid #222;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transition: bottom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }
    .phone-container.active { bottom: 20px; }

    /* TikTok UI */
    .tiktok-screen {
      position: relative; width: 100%; height: 100%; background: #111;
    }
    .tiktok-video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .tiktok-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px; pointer-events: none;
    }
    .tiktok-header {
      text-align: center; font-size: 13px; font-weight: bold;
      color: rgba(255,255,255,0.8); text-shadow: 0 1px 4px #000;
    }
    .tiktok-side {
      position: absolute; right: 10px; bottom: 80px;
      display: flex; flex-direction: column; gap: 12px; align-items: center;
    }
    .icon-btn {
      width: 36px; height: 36px; background: rgba(0,0,0,0.4);
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 18px; color: #fff;
    }
    .tiktok-footer {
      margin-bottom: 10px; font-size: 12px; text-shadow: 0 1px 4px #000;
    }

    /* Кнопки управления для мобилок */
    .controls {
      position: absolute; bottom: 10px; left: 10px;
      display: flex; gap: 10px; z-index: 30;
    }
    .action-btn {
      background: #e63946; color: #fff; border: none;
      padding: 14px 20px; border-radius: 12px; font-weight: bold;
      font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      active: scale(0.95);
    }

    /* Статусы и предупреждения */
    .warning-indicator {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(230, 57, 70, 0.9); color: #fff; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; display: none; z-index: 15;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.1); } }

    .score-board {
      position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6);
      padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: bold;
    }

    /* Экран проигрыша */
    .game-over {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100; display: none;
    }
    .game-over h1 { color: #e63946; font-size: 28px; margin-bottom: 10px; }
    .game-over p { margin-bottom: 20px; text-align: center; max-width: 80%; }
    .restart-btn {
      background: #2a9d8f; color: #fff; border: none; padding: 12px 24px;
      border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="score-board">Зарплата: <span id="score">0</span> руб.</div>
    <div class="warning-indicator" id="warning">⚠️ ПЕРВЫЙ ОТДЕЛ ИДЁТ!</div>

    <div class="cabin">
      <!-- Лобовое стекло -->
      <div class="windshield">
        <div class="quarry-bg"></div>
        <div class="inspector" id="inspector">
          <div class="helmet"><div class="helmet-visor"></div></div>
          <div class="head"></div>
          <div class="body-suit"><div class="vest"></div></div>
        </div>
      </div>

      <!-- Приборная панель -->
      <div class="dashboard">
        <div class="wheel">
          <div class="wheel-hands" id="hands">
            <div class="hand"></div>
            <div class="hand"></div>
          </div>
        </div>

        <div class="partner">
          <div class="partner-cap"></div>
          <div class="partner-head"></div>
          <div class="speech-bubble" id="speech">Прячь трубу, начальник идёт!</div>
        </div>
      </div>
    </div>

    <!-- Телефон -->
    <div class="phone-container" id="phone">
      <div class="tiktok-screen">
        <video class="tiktok-video" id="tt-video" autoplay loop muted playsinline></video>
        <div class="tiktok-overlay">
          <div class="tiktok-header">Рекомендации</div>
          <div class="tiktok-side">
            <div class="icon-btn">❤️</div>
            <div class="icon-btn">💬</div>
            <div class="icon-btn">➡️</div>
          </div>
          <div class="tiktok-footer">
            <b id="tt-author">@работяга51</b>
            <p id="tt-desc">Когда смена только началась... #белаз #карьер</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Управление -->
    <div class="controls">
      <button class="action-btn" id="toggle-phone">📱 Достать / Спрятать (Пробел)</button>
    </div>

    <!-- Game Over -->
    <div class="game-over" id="game-over">
      <h1>УВОЛЕН БЕЗ ЗП!</h1>
      <p id="dismissal-reason">Первый отдел заметил тебя с телефоном в кабине БеЛАЗа.</p>
      <button class="restart-btn" onclick="restartGame()">Попробовать снова</button>
    </div>
  </div>

  <script>
    // Сканирование локальных видео tiktok1.mp4 ... tiktok50.mp4
    const videoList = [];
    for (let i = 1; i <= 50; i++) {
      videoList.push(`tiktok${i}.mp4`);
    }

    // Демо-видео на случай если нет локальных
    const fallbackVideos = [
      'https://assets.mixkit.co/videos/preview/mixkit-dumper-truck-working-in-a-quarry-42511-large.mp4',
      'https://assets.mixkit.co/videos/preview/mixkit-construction-site-dumper-truck-42510-large.mp4'
    ];

    let currentVideoIdx = 0;
    let score = 0;
    let isPhoneOut = false;
    let isInspectorComing = false;
    let isGameOver = false;
    let savedVideoTime = 0;

    const phone = document.getElementById('phone');
    const hands = document.getElementById('hands');
    const video = document.getElementById('tt-video');
    const inspector = document.getElementById('inspector');
    const warning = document.getElementById('warning');
    const speech = document.getElementById('speech');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('game-over');
    const toggleBtn = document.getElementById('toggle-phone');

    function loadVideo(index) {
      const src = videoList[index % videoList.length];
      video.src = src;
      video.onerror = () => {
        // Если файла tiktokN.mp4 нет, берем fallback
        video.src = fallbackVideos[index % fallbackVideos.length];
      };
      video.currentTime = savedVideoTime;
    }

    function togglePhone() {
      if (isGameOver) return;
      isPhoneOut = !isPhoneOut;

      if (isPhoneOut) {
        phone.classList.add('active');
        hands.classList.remove('visible');
        video.muted = false;
        video.play().catch(() => {});
      } else {
        savedVideoTime = video.currentTime;
        video.pause();
        phone.classList.remove('active');
        hands.classList.add('visible');
      }
    }

    // Обработка кнопки и клавиши Пробел
    toggleBtn.addEventListener('click', togglePhone);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePhone();
      }
    });

    // Свайп видео
    let startY = 0;
    phone.addEventListener('touchstart', e => startY = e.touches[0].clientY);
    phone.addEventListener('touchend', e => {
      let endY = e.changedTouches[0].clientY;
      if (startY - endY > 50) {
        currentVideoIdx++;
        savedVideoTime = 0;
        loadVideo(currentVideoIdx);
      }
    });

    // Михалыч говорит
    const phrases = [
      "Михалыч: Слышишь шаги? Прячь трубу!",
      "Михалыч: Первый отдел на лестнице!",
      "Михалыч: Руки на руль держи, едет кто-то!",
      "Михалыч: Смотри в оба, инспектор шныряет!"
    ];

    function showMichalych() {
      speech.innerText = phrases[Math.floor(Math.random() * phrases.length)];
      speech.style.display = 'block';
      setTimeout(() => speech.style.display = 'none', 2500);
    }

    // Игровой цикл опасности
    function scheduleInspector() {
      if (isGameOver) return;
      let nextCheck = Math.random() * 4000 + 3000;

      setTimeout(() => {
        if (isGameOver) return;
        isInspectorComing = true;
        warning.style.display = 'block';
        showMichalych();

        // Время до прихода инспектора
        setTimeout(() => {
          if (isGameOver) return;
          inspector.classList.add('active');

          // Проверка поимки
          setTimeout(() => {
            if (isPhoneOut) {
              triggerGameOver();
            } else {
              // Пронесло!
              setTimeout(() => {
                inspector.classList.remove('active');
                warning.style.display = 'none';
                isInspectorComing = false;
                scheduleInspector();
              }, 1500);
            }
          }, 600);
        }, 1200);
      }, nextCheck);
    }

    // Начисление ЗП при просмотре
    setInterval(() => {
      if (isPhoneOut && !isGameOver) {
        score += 15;
        scoreEl.innerText = score;
      }
    }, 500);

    function triggerGameOver() {
      isGameOver = true;
      video.pause();
      gameOverEl.style.display = 'flex';
    }

    function restartGame() {
      isGameOver = false;
      score = 0;
      scoreEl.innerText = 0;
      isPhoneOut = false;
      isInspectorComing = false;
      phone.classList.remove('active');
      inspector.classList.remove('active');
      warning.style.display = 'none';
      gameOverEl.style.display = 'none';
      hands.classList.add('visible');
      scheduleInspector();
    }

    // Инициализация
    hands.classList.add('visible');
    loadVideo(0);
    scheduleInspector();
  </script>
</body>
</html>
