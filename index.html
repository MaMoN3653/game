<!DOCTYPE1 html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>САУ Симулятор: МЕМНАЯ АРТИЛЛЕРИЯ 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Impact', 'Arial Black', sans-serif; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* UI Overlays */
    .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
    .interactive { pointer-events: auto; }

    /* Glassmorphism Panel */
    .panel { background: rgba(15, 25, 15, 0.65); backdrop-filter: blur(8px); border: 2px solid rgba(100, 255, 100, 0.4); border-radius: 12px; padding: 10px 14px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); color: #8eff8e; text-shadow: 0 0 4px #000; }

    /* Scope overlay */
    #scope-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
    .scope-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(85vw, 85vh); height: min(85vw, 85vh); border-radius: 50%; border: 3px solid rgba(0, 255, 100, 0.8); box-shadow: 0 0 0 2000px rgba(0, 10, 0, 0.92); }
    .scope-cross-v { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(0, 255, 100, 0.6); transform: translateX(-50%); }
    .scope-cross-h { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(0, 255, 100, 0.6); transform: translateY(-50%); }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; width: 100%; }
    .title-box { font-size: 1.2rem; color: #ffe600; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }

    /* Minimap */
    #minimap-card { width: 120px; height: 120px; border-radius: 50%; border: 2px solid #55ff55; background: rgba(0, 30, 0, 0.7); position: relative; overflow: hidden; }
    #minimap-canvas { width: 100%; height: 100%; }

    /* Compact Flight Overlay in Top Corner */
    #flight-hud { position: absolute; top: 12px; right: 12px; z-index: 25; display: none; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); border: 1.5px solid #ffcc00; border-radius: 8px; padding: 8px 12px; pointer-events: none; color: #fff; font-size: 0.85rem; }
    #flight-hud .flight-title { color: #ffe600; font-weight: bold; font-size: 0.95rem; text-align: center; margin-bottom: 2px; }

    /* Touch Controls */
    .controls-container { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-bottom: 6px; }
    .dpad-container { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 4px; }
    .btn-dpad { background: rgba(20, 60, 20, 0.6); border: 2px solid #55ff55; color: #fff; font-size: 1.4rem; font-weight: bold; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-dpad:active { background: rgba(100, 255, 100, 0.6); transform: scale(0.95); }

    .action-panel { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .btn-action { background: linear-gradient(180deg, #ff8800, #cc3300); border: 2px solid #ffaa00; color: #fff; padding: 12px 20px; font-size: 1.1rem; border-radius: 12px; font-family: inherit; font-weight: bold; cursor: pointer; text-shadow: 0 2px 4px #000; box-shadow: 0 4px 15px rgba(255, 100, 0, 0.4); }
    .btn-action:active { transform: scale(0.95); background: #ffaa00; }
    .btn-sec { background: rgba(20, 40, 20, 0.7); border: 1.5px solid #77ff77; color: #77ff77; padding: 8px 12px; font-size: 0.85rem; border-radius: 8px; font-family: inherit; cursor: pointer; }

    /* Meme Notifications */
    #meme-banner { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%) scale(0); z-index: 30; font-size: 2.2rem; color: #ffe600; text-shadow: 3px 3px 0 #ff0055, -2px -2px 0 #000; text-align: center; pointer-events: none; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27); width: 90%; }
    #meme-banner.active { transform: translate(-50%, -50%) scale(1); }

    .selector-row { display: flex; gap: 6px; margin-top: 4px; }
    .btn-select { background: rgba(0,0,0,0.5); border: 1px solid #8eff8e; color: #8eff8e; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .btn-select.active { background: #ffe600; color: #000; font-weight: bold; border-color: #ffe600; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Scope Overlay -->
  <div id="scope-overlay">
    <div class="scope-circle">
      <div class="scope-cross-v"></div>
      <div class="scope-cross-h"></div>
    </div>
  </div>

  <!-- Compact Flight HUD (Top Right, unobtrusive) -->
  <div id="flight-hud">
    <div class="flight-title">🚀 ПОЛЁТ СНАРЯДА</div>
    <div>Высота: <span id="flight-alt" style="color:#ffe600;">0</span>м | Дист: <span id="flight-dist" style="color:#ffe600;">0</span>м</div>
    <div style="font-size: 0.75rem; color:#aaa; margin-top: 2px;">Управление: W/A/S/D или Стрелки</div>
  </div>

  <!-- Meme Notification Banner -->
  <div id="meme-banner">В САМЫЙ ПЯТАЧОК! 🎯</div>

  <!-- Main HUD Layer -->
  <div class="hud-layer">
    <div class="top-bar">
      <div class="panel title-box interactive">
        <span>🐟 САУ "ЩУКА-152"</span>
        <button class="btn-sec" id="btn-bgm">🔊 МУЗЫКА</button>
      </div>
      <div id="minimap-card" class="interactive">
        <canvas id="minimap-canvas"></canvas>
      </div>
    </div>

    <!-- Telemetry & Ammo Selection Panel -->
    <div class="panel interactive" style="align-self: flex-start; max-width: 320px; font-size: 0.85rem;">
      <div>АЗИМУТ: <span id="tele-azimuth" style="color:#fff;">0°</span> | УГОЛ: <span id="tele-elevation" style="color:#fff;">15°</span></div>
      <div>ДИСТ. ЦЕЛИ: <span id="tele-dist" style="color:#ffe600;">1200м</span></div>
      <div style="margin-top: 6px; font-size:0.75rem; color:#ffe600;">ВЫБОР СНАРЯДА:</div>
      <div class="selector-row">
        <button class="btn-select active" data-ammo="pike">🐟 ЩУКА</button>
        <button class="btn-select" data-ammo="catfish">🐱 СОМ-ТЯЖ</button>
        <button class="btn-select" data-ammo="sardines">🥫 ШПРОТЫ</button>
        <button class="btn-select" data-ammo="bread">🍞 БАТОН</button>
      </div>
    </div>

    <!-- Bottom Controls Container -->
    <div class="controls-container">
      <!-- Touch D-Pad Aiming -->
      <div class="dpad-container interactive">
        <div></div>
        <div class="btn-dpad" id="btn-up">▲</div>
        <div></div>
        <div class="btn-dpad" id="btn-left">◀</div>
        <div class="btn-dpad" id="btn-sens" style="font-size:0.7rem; color:#ffe600;">ЧУВСТВ<br>МЕДЛ</div>
        <div class="btn-dpad" id="btn-right">▶</div>
        <div></div>
        <div class="btn-dpad" id="btn-down">▼</div>
        <div></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-panel interactive">
        <div style="display:flex; gap:6px;">
          <button class="btn-sec" id="btn-cam">👁️ ПРИЦЕЛ</button>
          <button class="btn-sec" id="btn-zoom">🔍 ZOOM: 1x</button>
        </div>
        <button class="btn-action" id="btn-fire">🔥 ОГОНЬ (ПЛИ!)</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio Sound Synthesizer (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmPlaying = false;
      }
      playLaunch() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.4);
      }
      playImpact() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(80, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.6);
        gain.gain.setValueAtTime(1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.6);
      }
      playQuack() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.2);
      }
    }
    const snd = new SoundEngine();

    // --- Game Logic & Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.00015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 12000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Lights
    const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(2000, 4000, 2000);
    scene.add(dirLight);

    // Terrain Creation (10,000m x 10,000m)
    const mapSize = 10000;
    const terrGeo = new THREE.PlaneBufferGeometry(mapSize, mapSize, 64, 64);
    terrGeo.rotateX(-Math.PI / 2);
    const pos = terrGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      if (Math.abs(x) > 300 || Math.abs(z) > 300) {
        pos.setY(i, Math.sin(x * 0.002) * Math.cos(z * 0.002) * 120 + Math.sin(x * 0.0005) * 200);
      }
    }
    terrGeo.computeVertexNormals();
    const terrMat = new THREE.MeshLambertMaterial({ color: 0x4b7832 });
    const terrain = new THREE.Mesh(terrGeo, terrMat);
    scene.add(terrain);

    // Player SPG Model
    const spgGroup = new THREE.Group();
    scene.add(spgGroup);
    // Chassis
    const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(6, 2.5, 10), new THREE.MeshLambertMaterial({ color: 0x2e4a21 }));
    bodyMesh.position.y = 1.25;
    spgGroup.add(bodyMesh);
    // Turret & Barrel
    const turretGroup = new THREE.Group();
    turretGroup.position.set(0, 2.5, -1);
    spgGroup.add(turretGroup);
    const turretMesh = new THREE.Mesh(new THREE.BoxGeometry(5, 2, 6), new THREE.MeshLambertMaterial({ color: 0x3b5e2b }));
    turretGroup.add(turretMesh);
    const barrelPivot = new THREE.Group();
    barrelPivot.position.set(0, 0.3, 2.5);
    turretGroup.add(barrelPivot);
    const barrelMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 8, 12), new THREE.MeshLambertMaterial({ color: 0x1f3316 }));
    barrelMesh.rotateX(Math.PI / 2);
    barrelMesh.position.z = 4;
    barrelPivot.add(barrelMesh);

    // Ammo Models Generator
    function createPikeMesh() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 4, 8), new THREE.MeshStandardMaterial({ color: 0x55aa55 }));
      body.rotateX(Math.PI / 2);
      g.add(body);
      return g;
    }

    // Targets Array
    const targets = [];
    const memeNames = ['ЕЖИК В ТУМАНЕ 🦔', 'КОТ В КОРОБКЕ 🐱', 'БАБУШКА 👵', 'ГУСЬ HONK 🪿', 'ЖИГУЛИ 🚗'];
    function spawnTargets() {
      const positions = [
        { x: 0, z: -1000 }, { x: 300, z: -1600 }, { x: -400, z: -2200 },
        { x: 800, z: -3000 }, { x: -600, z: -3800 }
      ];
      positions.forEach((p, idx) => {
        const tgt = new THREE.Mesh(new THREE.SphereGeometry(12, 16, 16), new THREE.MeshLambertMaterial({ color: 0xff3333 }));
        tgt.position.set(p.x, 12, p.z);
        scene.add(tgt);
        targets.push({ mesh: tgt, name: memeNames[idx % memeNames.length], hp: 1 });
      });
    }
    spawnTargets();

    // Aiming State
    let azimuth = 0;
    let elevation = 15;
    let selectedAmmo = 'pike';
    let currentZoom = 1;
    let cameraMode = 'scope'; // 'scope' or 'fly'
    let activeShell = null;
    let sensSpeed = 0.2;

    // Control Inputs
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Touch D-Pad setup
    function setupHoldBtn(id, action) {
      const el = document.getElementById(id);
      let timer = null;
      const start = (e) => { e.preventDefault(); action(); timer = setInterval(action, 30); };
      const stop = () => clearInterval(timer);
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointerleave', stop);
    }
    setupHoldBtn('btn-up', () => elevation = Math.min(75, elevation + sensSpeed));
    setupHoldBtn('btn-down', () => elevation = Math.max(-3, elevation - sensSpeed));
    setupHoldBtn('btn-left', () => azimuth -= sensSpeed);
    setupHoldBtn('btn-right', () => azimuth += sensSpeed);

    document.getElementById('btn-sens').onclick = () => {
      if (sensSpeed === 0.2) { sensSpeed = 0.05; document.getElementById('btn-sens').innerHTML = "ЧУВСТВ<br>ТОЧНО"; }
      else { sensSpeed = 0.2; document.getElementById('btn-sens').innerHTML = "ЧУВСТВ<br>МЕДЛ"; }
    };

    // Ammo Selector Buttons
    document.querySelectorAll('.btn-select').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.btn-select').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAmmo = btn.dataset.ammo;
      };
    });

    // Firing Mechanics
    document.getElementById('btn-fire').onclick = () => {
      if (activeShell) return;
      snd.playLaunch();

      const shell = createPikeMesh();
      const muzzlePos = new THREE.Vector3();
      barrelPivot.getWorldPosition(muzzlePos);
      shell.position.copy(muzzlePos);
      scene.add(shell);

      const speed = 260;
      const radAz = (azimuth * Math.PI) / 180;
      const radEl = (elevation * Math.PI) / 180;
      const vel = new THREE.Vector3(
        Math.sin(radAz) * Math.cos(radEl) * speed,
        Math.sin(radEl) * speed,
        -Math.cos(radAz) * Math.cos(radEl) * speed
      );

      activeShell = { mesh: shell, vel: vel, alive: true };
      cameraMode = 'fly';
      document.getElementById('flight-hud').style.display = 'block';
    };

    // Camera Switch & Zoom
    document.getElementById('btn-cam').onclick = () => {
      cameraMode = cameraMode === 'scope' ? 'free' : 'scope';
      document.getElementById('scope-overlay').style.display = cameraMode === 'scope' ? 'block' : 'none';
    };
    document.getElementById('btn-zoom').onclick = () => {
      if (currentZoom === 1) currentZoom = 2.5;
      else if (currentZoom === 2.5) currentZoom = 5;
      else currentZoom = 1;
      camera.fov = 60 / currentZoom;
      camera.updateProjectionMatrix();
      document.getElementById('btn-zoom').innerText = `🔍 ZOOM: ${currentZoom}x`;
    };

    // Meme Banner Trigger
    function showMemeBanner(text) {
      const b = document.getElementById('meme-banner');
      b.innerText = text;
      b.classList.add('active');
      setTimeout(() => b.classList.remove('active'), 2500);
    }

    // Animation & Physics Loop
    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min((performance.now() - lastTime) / 1000, 0.1);
      lastTime = performance.now();

      // Keyboard Controls
      if (keys['KeyW'] || keys['ArrowUp']) elevation = Math.min(75, elevation + sensSpeed);
      if (keys['KeyS'] || keys['ArrowDown']) elevation = Math.max(-3, elevation - sensSpeed);
      if (keys['KeyA'] || keys['ArrowLeft']) azimuth -= sensSpeed;
      if (keys['KeyD'] || keys['ArrowRight']) azimuth += sensSpeed;

      // Update Turret Rotation
      turretGroup.rotation.y = (-azimuth * Math.PI) / 180;
      barrelPivot.rotation.x = (-elevation * Math.PI) / 180;

      // Update Active Shell Flight & Controls
      if (activeShell) {
        // In-flight steering
        if (keys['KeyA'] || keys['ArrowLeft']) activeShell.vel.x -= 20 * dt;
        if (keys['KeyD'] || keys['ArrowRight']) activeShell.vel.x += 20 * dt;
        if (keys['KeyW'] || keys['ArrowUp']) activeShell.vel.y += 20 * dt;
        if (keys['KeyS'] || keys['ArrowDown']) activeShell.vel.y -= 20 * dt;

        // Gravity
        activeShell.vel.y -= 9.81 * 8 * dt;
        activeShell.mesh.position.addScaledVector(activeShell.vel, dt);
        activeShell.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), activeShell.vel.clone().normalize());

        // Update Flight Telemetry HUD
        document.getElementById('flight-alt').innerText = Math.max(0, Math.round(activeShell.mesh.position.y));
        document.getElementById('flight-dist').innerText = Math.round(activeShell.mesh.position.distanceTo(spgGroup.position));

        // Camera Follow Shell
        if (cameraMode === 'fly') {
          const camOffset = activeShell.vel.clone().normalize().multiplyScalar(-30).add(new THREE.Vector3(0, 8, 0));
          camera.position.copy(activeShell.mesh.position).add(camOffset);
          camera.lookAt(activeShell.mesh.position);
        }

        // Collision Check (Targets & Ground)
        targets.forEach(t => {
          if (t.hp > 0 && activeShell.mesh.position.distanceTo(t.mesh.position) < 20) {
            t.hp = 0;
            scene.remove(t.mesh);
            snd.playImpact();
            showMemeBanner(`УНИЧТОЖЕН: ${t.name}! 💥`);
            removeShell();
          }
        });

        if (activeShell && activeShell.mesh.position.y <= 1) {
          snd.playQuack();
          showMemeBanner('БУЛЬК! ПРЯМО В ГРЯЗЬ! 💦');
          removeShell();
        }
      } else {
        // Scope Camera View
        if (cameraMode === 'scope') {
          const scopePos = new THREE.Vector3();
          barrelPivot.getWorldPosition(scopePos);
          camera.position.copy(scopePos).add(new THREE.Vector3(0, 1.2, 0));
          const targetLook = new THREE.Vector3(0, 0, -100)
            .applyAxisAngle(new THREE.Vector3(1, 0, 0), barrelPivot.rotation.x)
            .applyAxisAngle(new THREE.Vector3(0, 1, 0), turretGroup.rotation.y)
            .add(scopePos);
          camera.lookAt(targetLook);
        }
      }

      // Update Telemetry Panel
      document.getElementById('tele-azimuth').innerText = `${Math.round(azimuth)}°`;
      document.getElementById('tele-elevation').innerText = `${Math.round(elevation)}°`;

      renderer.render(scene, camera);
    }

    function removeShell() {
      if (activeShell) {
        scene.remove(activeShell.mesh);
        activeShell = null;
        document.getElementById('flight-hud').style.display = 'none';
        setTimeout(() => cameraMode = 'scope', 1200);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
